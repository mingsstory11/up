<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pc&mobile 반응형 만들기</title>
  <style>
    *{margin: 0; padding: 0;}
    ul{list-style: none;}
    a{text-decoration: none; color: inherit;}

    header{
      width: 100%; 
      border-bottom: 1px solid rgb(240, 240, 240);
      
    }
    header .gnb{
      width: 90%;
      height: 70px;
      line-height: 70px;
      margin: 0 auto;
      display: flex;
    }
    header .gnb .logo{
      font-size: 20px;
      font-weight: bold;
    }
    header .gnb .nav{
      margin-left: auto;
      display: flex;
      gap: 30px;
      font-size: 18px;
      color: #6d6d6d;
    }

    /* -----header End----- */
    
    main{
      width: 90%; margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(1, 1fr);
      gap: 100px;
    }


    .main-visual{
      width: 100%;
      display: grid;
      gap: 10%;
      grid-template-columns: repeat(2, 1fr);
      /* margin-top: 50px; */
    }

    .main-text{
      width: 100%;
      height: 30%;
      padding-top: 20%;
      /* background-color: #7c5858; */
      display: grid;
      gap: 20%;
      grid-template-columns: repeat(1, 1fr);
    }

    .main-text h2{
      font-size: clamp(2rem, 4vw, 4rem);
    }

    .main-text .sub-text{
      font-size: clamp(0.8rem, 2vw, 1.4rem);

    }

    .btn{
      width: 20%;
      height: 40px;
      line-height: 40px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      background-color: #f0cece;

      font-size: clamp(0.7rem, 1.4vw, 1rem);
    }

    .main-img img{
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 10px;
      object-fit: cover;
      margin-top: 10%;
    }

    .cont2-in, .cont3-in{
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2%;
    }


    .cont2-in > li, 
    .cont3-in > li{
      position: relative;
    }

    .cont2-in > li p,
    .cont3-in > li p{
      width: 100%;
      height: 40px;
      line-height: 40px;
      background-color: #ffffff8e;
      text-align: center;
      position: absolute;
      top: 50%; left: 0;
      transform: translateY(-50%);
    }
    .cont2-in img, .cont3-in img{
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 10px;
      object-fit: cover;
    }



    footer{
      width: 100%; height: 180px;
      background-color: rgb(37, 37, 37);
      margin-top: 100px;
      padding: 40px 0;
    }
    footer .copy{
      text-align: center;
    }
    footer .copy h2{
      font-size: 20px;
      margin-top: 15px;
      margin-bottom: 15px;  
      color: #fff;
    }
    .copy p{
      font-size: 17px;
      color: #abaaaa;
      line-height: 25px;
    }

    @media (max-width:550px) {
  


      .main-visual{
        grid-template-columns: repeat(1, 1fr);
      }

      .cont2-in, .cont3-in{
        grid-template-columns: repeat(1, 1fr);
      }
      
    }

    






  </style>
</head>
<body>
  <header>
    <ul class="gnb">
      <li class="logo"><a href="#">BREW & CO</a></li>
      <li class="nav">
        <a href="#">메뉴</a>
        <a href="#">소개</a>
        <a href="#">문의</a>
      </li>
    </ul>
  </header>

  <main>
    <section class="main-visual">
      <div class="main-text">
        <h2>달콤한 도넛처럼</h2>

        <p class="sub-text">
          바쁜 도시의 흐름 속에서<br> 
          일상이 잠시 휴가처럼 느껴지는 순간,<br> 
          도심 속 작은 쉼표를 전합니다.
        </p>
        <p href="#" class="btn">메뉴보기</p>
      </div>
      <div class="main-img">
          <img src="https://images.unsplash.com/photo-1509474520651-53cf6a80536f?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="도넛1">
      </div>
    </section>

    <section class="cont2">
      <h2>왜 우리인가?</h2>
        <ul class="cont2-in">
          <li>
            <img src="https://images.unsplash.com/photo-1543512601-f0b56be2147e?q=80&w=684&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="도넛2">
            <p>스폐셜 도넛</p>
          </li>
          <li>
            <img src="https://images.unsplash.com/photo-1648748005716-f52ba766054d?q=80&w=1169&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="도넛3">
            <p>매일 베이커리</p>
          </li>
          <li>        
            <img src="https://images.unsplash.com/photo-1643116218883-d5cb85ef840e?q=80&w=880&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="도넛4">
            <p>편안한 공간</p>
          </li>
        </ul>
    </section>

    <section class="cont3">
      <h2>인기 메뉴</h2>
        <ul class="cont3-in">
          <li>
            <img src="https://images.unsplash.com/photo-1709188866085-923eb283a55a?q=80&w=627&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="오리지널 도넛">
            <p>오리지널 도넛</p>
          </li>
          <li>
            <img src="https://images.unsplash.com/photo-1630150275481-fdd323506564?q=80&w=1208&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="초코도넛">
            <p>초코 도넛</p>
          </li>
          <li>
            <img src="https://images.unsplash.com/photo-1769372742160-488b07674729?q=80&w=735&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="크림도넛">
            <p>크림도넛</p>
          </li>
        </ul>
      </li>
    </section>
  </main>

  <footer>
    <div class="copy">
      <h2>BREW & CO</h2>
      <p>서울 마포구 연남동<br>
      2026 All Rights Reserved.</p>
    </div>
  </footer>
</body>
</html>
